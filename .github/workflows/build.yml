name: Build Spotifi APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Buildozer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-v2-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            python3-pip build-essential git zip unzip \
            openjdk-17-jdk libffi-dev libssl-dev autoconf \
            libtool pkg-config zlib1g-dev libncurses5-dev \
            cmake libltdl-dev ccache

      - name: Install Python build tools
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Set up Android SDK environment
        run: |
          echo "ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV

      - name: Accept Android SDK licenses
        run: |
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

      - name: Build APK
        run: |
          buildozer -v android debug 2>&1 | tee build.log
        timeout-minutes: 45

      - name: List build output (debug)
        if: always()
        run: |
          echo "=== Repo root ==="
          ls -la
          echo "=== bin/ contents (if exists) ==="
          ls -la bin/ 2>/dev/null || echo "bin/ does not exist at repo root"
          echo "=== Searching for any .apk ==="
          find . -name "*.apk" 2>/dev/null || echo "No .apk found anywhere"
          echo "=== Buildozer .buildozer dir ==="
          ls ~/.buildozer/android/platform/ 2>/dev/null || echo "no .buildozer platform dir"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spotifi-apk
          path: bin/*.apk
          retention-days: 7
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 3
